[package]
name = "mejiro-rmk"
version = "0.1.0"
edition = "2021"
description = "RMK adapter for the portable Mejiro/Gemini input engine"
license = "MIT OR Apache-2.0"

[features]
default = []
usb-debug = ["dep:log"]

[dependencies]
mejiro-core = { path = "../mejiro-core" }
rmk = { git = "https://github.com/rmk-rs/rmk", rev = "55ce0f99c5f679ff0718e6ffea3b641fc61ccd1a", version = "=0.9.0", default-features = false }
log = { version = "0.4", optional = true }

[dev-dependencies]
critical-section = { version = "1.2", features = ["std"] }
