[package]
name = "mejiro-rmk"
version = "0.1.0"
edition = "2021"
description = "RMK adapter for the portable Mejiro/Gemini input engine"
license = "MIT OR Apache-2.0"

[dependencies]
mejiro-core = { path = "../mejiro-core" }
rmk = { version = "=0.8.2", default-features = false, features = [
    "controller",
    "mejiro",
] }

[dev-dependencies]
critical-section = { version = "1.2", features = ["std"] }
