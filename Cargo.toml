[workspace]
members = ["."]
default-members = ["."]
resolver = "2"

[package]
name = "rmk-mejiro"
version = "0.1.0"
authors = ["n18011"]
description = "Mejiro31 input engine ported to Cygnus-M RMK firmware"
homepage = "https://github.com/n18011/RMK-Mejiro"
repository = "https://github.com/n18011/RMK-Mejiro"
readme = "README.md"
edition = "2021"
license = "MIT OR Apache-2.0"

[features]
# Keep host tests free of embedded logging backends. Firmware tasks select a
# profile explicitly below.
default = []
firmware = []
swd-debug = ["firmware", "rmk/defmt"]
# RMK's USB logger is a CDC-ACM interface. It cannot be combined with RMK's
# defmt feature, so USB logging is an explicit alternative build profile.
usb-debug = ["firmware", "rmk/usb_log", "mejiro-rmk/usb-debug"]

[dependencies]
# The shared Mejiro crates are maintained in their standalone repository.
mejiro-core = { git = "https://github.com/n18011/mejiro", rev = "ae395bd9bd56a7010d79fd7e94c7494928e4e97c", version = "=0.1.0" }
mejiro-rmk = { git = "https://github.com/n18011/mejiro", rev = "ae395bd9bd56a7010d79fd7e94c7494928e4e97c", version = "=0.1.0" }
rmk = { git = "https://github.com/rmk-rs/rmk", rev = "55ce0f99c5f679ff0718e6ffea3b641fc61ccd1a", version = "=0.9.0", default-features = false, features = [
    "storage",
    "vial",
    "host_lock",
    "split",
    "async_matrix",
    "watchdog",
] }

[target.'cfg(target_arch = "arm")'.dependencies]
rmk = { git = "https://github.com/rmk-rs/rmk", rev = "55ce0f99c5f679ff0718e6ffea3b641fc61ccd1a", version = "=0.9.0", default-features = false, features = [
    "storage",
    "vial",
    "host_lock",
    "split",
    "async_matrix",
    "watchdog",
    "nrf52840_ble",
    "adafruit_bl",
] }
nrf-sdc = { git = "https://github.com/alexmoon/nrf-sdc", rev = "f54b6389ffa2750d4d3a4f5435660cb66b47e51a", features = [
    "defmt",
    "peripheral",
    "central",
    "nrf52840",
] }
nrf-mpsl = { git = "https://github.com/alexmoon/nrf-sdc", rev = "f54b6389ffa2750d4d3a4f5435660cb66b47e51a", features = [
    "defmt",
    "critical-section-impl",
    "nrf52840",
] }
bt-hci = { version = "0.9", default-features = false, features = ["defmt"] }

cortex-m = "0.7.7"
cortex-m-rt = "0.7.5"
embassy-time = { version = "0.5", features = ["tick-hz-32_768", "defmt", "defmt-timestamp-uptime"] }
embassy-nrf = { version = "0.11", features = [
    "defmt",
    "nrf52840",
    "time-driver-rtc1",
    "gpiote",
    "unstable-pac",
    "nfc-pins-as-gpio",
    "time",
] }
embassy-executor = { version = "0.10", features = [
    "defmt",
    "platform-cortex-m",
    "executor-thread",
] }
defmt = "1.0"
defmt-rtt = "1.0"
panic-probe = { version = "1.0", features = ["print-defmt"] }
static_cell = "2"

[build-dependencies]
xz2 = "0.1.7"
json = "0.12"
const-gen = "1.6"

# Split keyboard example
[[bin]]
name = "central"
path = "src/central.rs"
required-features = ["firmware"]

[[bin]]
name = "peripheral"
path = "src/peripheral.rs"
required-features = ["firmware"]

[profile.dev]
codegen-units = 1      # better optimizations
debug = true
opt-level = 1
overflow-checks = true
lto = false
panic = 'unwind'

[profile.release]
codegen-units = 1       # better optimizations
debug = true            # no overhead for bare-metal
opt-level = "z"         # optimize for binary size
overflow-checks = false
lto = "fat"
