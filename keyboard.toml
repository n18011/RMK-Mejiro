# Cygnus-M converted from ZMK to RMK 0.8.2.
# The matrix coordinates below preserve the original ZMK matrix transform.

[keyboard]
name = "Cygnus-M"
product_name = "Cygnus-M"
vendor_id = 0x4c4b
product_id = 0x4643
manufacturer = "n18011"
serial_number = "vial:f64c2b3c:000001"
chip = "nrf52840"
usb_enable = true

[host]
vial_enabled = true
# Vial lock解除用。Central側の右手ホーム寄りキー (row=0,col=7/8)
unlock_keys = [[0, 7], [0, 8]]

[layout]
rows = 4
cols = 13
layers = 10
# Layer indices are zero-based: base=0 (Mejiro), qwerty=1, qwerty_shift=2,
# function=3, arrow=4, mouse=5, scroll=6, numeric=7, bluetooth=8,
# number_shift=9. Keep LT(...) references synchronized with this order.
matrix_map = """
(0,6,L) (0,0,L) (0,1,L) (0,2,L) (0,3,L) (0,4,L) (0,7,R) (0,8,R) (0,9,R) (0,10,R) (0,11,R) (0,12,R)
(1,6,L) (1,0,L) (1,1,L) (1,2,L) (1,3,L) (1,4,L) (1,5,L) (3,7,R) (1,7,R) (1,8,R) (1,9,R) (1,10,R) (1,11,R) (1,12,R)
(2,6,L) (2,0,L) (2,1,L) (2,2,L) (2,3,L) (2,4,L) (2,5,L) (3,8,R) (2,7,R) (2,8,R) (2,9,R) (2,10,R) (2,11,R) (2,12,R)
(3,6,L) (3,0,L) (3,1,L) (3,2,L) (3,3,L) (3,4,L) (3,5,L) (3,9,R) (3,10,R) (3,11,R) (3,12,R)
"""

# Base layer is Mejiro/Gemini. Hold either QWERTY layer-tap for the
# conventional QWERTY layer; the right thumb also exposes the shifted layer
# and a Bluetooth recovery layer-tap. The encoder scroll direction follows
# the original ROTATE sensor binding: clockwise = down, counter-clockwise = up.
[[layer]]
name = "base"
keys = """
Kb0 Kb1 Kb2 Kb3 Kb4 Kb5 Kb12 Kb13 Kb14 Kb15 Kb16 Kb17

_ Kb6 Kb7 Kb8 Kb9 Kb10 Kb11 Kb18 Kb19 Kb20 Kb21 Kb22 Kb23 _

_ _ _ _ _ _ _ _ _ _ _ _ _ _

_ _ _ _ _ LT(1,Space) _ LT(1,Space) LT(2,Enter) LT(8,Escape) _
"""
encoders = [["MouseWheelDown", "MouseWheelUp"]]

[[layer]]
name = "qwerty"
keys = """
LT(8,Escape) Q W E R T Y U I O P Backspace

Tab A S D F G MouseBtn3 Up H J K LT(9,L) LT(7,Minus) Enter

LShift Z X C V B Delete Down N M Comma Dot Slash RShift

LCtrl LGui LAlt Language5 Left Space Right Backspace LT(2,Enter) Delete RCtrl
"""

[[layer]]
name = "qwerty_shift"
keys = """
Escape Q W E R T Y U I O P Backspace

Tab A S D F G MouseBtn3 Up H J K L Semicolon Enter

LShift Z X C V B Delete Down N M Comma Dot Slash RShift

_ _ _ _ _ _ _ _ _ _ _
"""

[[layer]]
name = "function"
keys = """
_ F1 F2 F3 F4 F5 F1 F2 F3 F4 F5 _

_ F6 F7 F8 F9 F10 _ _ F6 F7 F8 F9 F10 _

_ F11 _ _ _ _ _ _ _ _ _ _ F11 _

_ F12 _ _ _ _ _ _ _ F12 _
"""

[[layer]]
name = "arrow"
keys = """
_ Escape WM(Tab, LCtrl|LShift) Up WM(Tab, LCtrl) _ _ _ _ _ _ _

_ Home Left Down Right End _ _ _ _ _ _ _ _

_ LShift WM(Left, LGui|LShift) _ WM(Right, LGui|LShift) _ _ _ _ _ _ _ _ _

_ _ _ _ _ _ _ _ _ _ _
"""
encoders = [["MouseWheelDown", "MouseWheelUp"]]

[[layer]]
name = "mouse"
keys = """
_ _ _ WM(PageUp, LCtrl) WM(PageDown, LCtrl) WM(R, LGui) WM(R, LGui) WM(PageUp, LCtrl) WM(PageDown, LCtrl) _ _ _

_ LT(7,Space) LT(6,Space) MouseBtn1 MouseBtn2 MouseBtn3 MouseBtn3 _ MouseBtn3 MouseBtn1 MouseBtn2 LT(6,Space) LT(7,Space) _

_ _ _ _ _ _ _ _ _ _ MouseBtn4 MouseBtn5 _ _

_ _ _ _ _ _ _ _ _ _ _
"""

[[layer]]
name = "scroll"
keys = """
_ _ _ _ _ _ _ _ _ _ _ _

_ _ _ _ _ _ _ _ _ _ _ _ _ _

_ _ _ _ _ _ _ _ _ _ _ _ _ _

_ _ _ _ _ _ _ _ _ _ _
"""

[[layer]]
name = "numeric"
keys = """
_ Minus Kp7 Kp8 Kp9 KpPlus SHIFTED(Kc6) SHIFTED(Kc7) SHIFTED(Grave) SHIFTED(Kc9) SHIFTED(Kc0) _

_ Slash Kp4 Kp5 Kp6 KpAsterisk WM(Kp0, LCtrl|LAlt) SHIFTED(Minus) SHIFTED(Kc1) SHIFTED(Kc2) SHIFTED(Kc3) SHIFTED(Kc4) SHIFTED(Kc5) _

_ MT(Kp0,LShift) Kp1 Kp2 Kp3 Dot Equal _ LeftBracket RightBracket SHIFTED(LeftBracket) SHIFTED(RightBracket) Backslash _

_ _ _ _ _ _ _ _ _ SHIFTED(Backslash) _
"""

[[layer]]
name = "bluetooth"
keys = """
_ _ _ _ _ _ User0 User1 User2 User3 User4 _

_ _ _ _ _ _ _ _ _ _ _ _ _ _

_ _ Kc1 Kc2 Kc3 Kp4 _ _ _ _ _ _ User7 User7

_ _ _ _ _ _ _ _ _ User9 User9
"""

[[layer]]
name = "number_shift"
keys = """
_ SHIFTED(Kc1) SHIFTED(Kc7) SHIFTED(Kc8) SHIFTED(Kc9) SHIFTED(Kc0) Kc6 Kc7 Grave Kc9 Kc0 _

_ SHIFTED(Slash) Kp4 Kp5 Kp6 KpAsterisk _ Kc1 Kc2 Kc3 Kc4 Kc5 Kc6 _

_ MT(Kp0,LShift) Kp1 Kp2 Kp3 Dot Equal _ LeftBracket RightBracket SHIFTED(LeftBracket) SHIFTED(RightBracket) Backslash _

_ _ _ _ _ _ _ _ _ SHIFTED(Backslash) _
"""

[behavior.combo]
timeout = "150ms"
combos = [
    { actions = ["H", "J"], output = "WM(Quote, LShift)" },
]

[behavior.morse]
hold_timeout = "200ms"
gap_timeout = "200ms"
hold_on_other_press = true

[ble]
enabled = true
battery_adc_pin = "vddh"
adc_divider_measured = 2000
adc_divider_total = 2806
default_tx_power = 0
ble_use_2m_phy = true

[split]
connection = "ble"

[split.central]
rows = 4
cols = 6
row_offset = 0
col_offset = 7

[split.central.matrix]
matrix_type = "normal"
row_pins = ["P0_03", "P0_28", "P0_29", "P1_11"]
col_pins = ["P1_15", "P1_14", "P1_13", "P1_12", "P0_10", "P1_10"]
# The original ZMK shield uses a col2row matrix.
row2col = false

[[split.central.input_device.pmw3610]]
name = "trackball"
spi.instance = "bitbang0"
spi.sck = "P0_05"
spi.mosi = "P0_04"
spi.miso = "P0_04"
spi.cs = "P0_09"
motion = "P0_02"
cpi = 1000
invert_x = false
invert_y = true
smart_mode = true

[[split.peripheral]]
rows = 4
cols = 7
row_offset = 0
col_offset = 0

[split.peripheral.matrix]
matrix_type = "normal"
row_pins = ["P0_03", "P0_28", "P0_29", "P1_11"]
col_pins = ["P1_15", "P1_14", "P1_13", "P1_12", "P0_10", "P0_09", "P0_04"]
row2col = false

[[split.peripheral.input_device.encoder]]
pin_a = "P0_05"
pin_b = "P0_02"
internal_pullup = true
phase = "resolution"
resolution = 2
reverse = false

[rmk]
split_peripherals_num = 1
ble_profiles_num = 5

[storage]
enabled = true
# Migration reset: erase legacy Vial/BLE storage at boot. Set false after one clean boot.
clear_storage = true
clear_layout = false
