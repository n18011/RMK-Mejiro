name: RMK-Mejiro CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_MIN_STACK: 67108864

jobs:
  host:
    name: Host tests and static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable (2026-08-15)
        with:
          components: clippy, rustfmt
      - name: Validate keyboard contract
        run: python3 tools/validate_keyboard.py
      - name: Test keyboard contract edge cases
        run: python3 -m unittest tools/test_validate_keyboard.py
      - name: Compare QMK static tables
        run: python3 tools/qmk_regression.py
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run TDD contract tests
        run: cargo test --workspace --target x86_64-unknown-linux-gnu --lib
      - name: Run Clippy
        run: cargo clippy --workspace --lib --target x86_64-unknown-linux-gnu -- -D warnings
      - name: Install coverage tool
        uses: taiki-e/install-action@3ee274a48739f9c49921feda61cb199dc7520e62 # cargo-llvm-cov
      - name: Enforce unit-test coverage
        run: cargo llvm-cov --workspace --target x86_64-unknown-linux-gnu --lib --fail-under-lines 80

  firmware:
    name: Build central and peripheral firmware
    runs-on: ubuntu-latest
    needs: host
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev
      - name: Configure libclang discovery
        run: |
          libclang_file="$(find /usr/lib -type f \( -name 'libclang.so*' -o -name 'libclang-*.so*' \) -print -quit)"
          test -n "$libclang_file"
          echo "Using libclang: $libclang_file"
          echo "LIBCLANG_PATH=$(dirname "$libclang_file")" >> "$GITHUB_ENV"
          clang_resource_dir="$(find "$(dirname "$libclang_file")/clang" -type d -name include -print -quit)"
          test -n "$clang_resource_dir"
          echo "BINDGEN_EXTRA_CLANG_ARGS=-I$clang_resource_dir" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable (2026-08-15)
        with:
          targets: thumbv7em-none-eabihf
          components: llvm-tools-preview
      - uses: cargo-bins/cargo-binstall@86d826d1f6561da3c7e6328638ebaa2d531d6193 # main (2026-08-15)
      - name: Install firmware tools
        run: cargo binstall cargo-make cargo-binutils cargo-hex-to-uf2 flip-link -y
      - name: Build firmware and generate UF2/HEX
        run: cargo make uf2 --release
      - name: Stage ELF firmware
        run: |
          cp target/thumbv7em-none-eabihf/release/central RMK-Mejiro-central.elf
          cp target/thumbv7em-none-eabihf/release/peripheral RMK-Mejiro-peripheral.elf
      - name: Validate firmware files
        run: file RMK-Mejiro-*.uf2 RMK-Mejiro-*.hex RMK-Mejiro-*.elf
      - name: Upload firmware bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: RMK-Mejiro-firmware
          path: |
            RMK-Mejiro-*.uf2
            RMK-Mejiro-*.hex
            RMK-Mejiro-*.elf
          if-no-files-found: error

  release:
    name: Publish release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: firmware
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: RMK-Mejiro-firmware
          path: dist
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/RMK-Mejiro-*
          generate_release_notes: true
